name: Daily Lipetsk OSM data
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/osm-data.yml'
      - 'scripts/collect_city_data.py'
      - 'scripts/publish_city_data.py'
      - 'src/domain/city_data.py'
permissions:
  contents: write
concurrency:
  group: daily-osm-publication
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate collector and geometry
        run: python -m unittest tests.unit.test_osm tests.unit.test_overpass_transport tests.unit.test_city_data tests.unit.test_city_feed -q
      - name: Collect complete city data
        run: python scripts/collect_city_data.py --output "$RUNNER_TEMP/city.json"
      - name: Publish to independent data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_city_data.py "$RUNNER_TEMP/city.json"
