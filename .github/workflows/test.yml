name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py serve.py osm.py businesses.py
      - run: python scripts/validate_project.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:material
      - run: git diff --exit-code -- static/vendor/material-web/material-components.js
      - run: pnpm run check:hero
      - run: |
          for module in static/js/*.js; do node --check "$module"; done
      - run: node --test tests/unit/scenario-storage.test.js
      - run: node --test tests/unit/field-check-storage.test.js
      - run: node --test tests/unit/data-delivery.test.js
      - run: node --test tests/unit/analysis-focus.test.js tests/unit/recommendation-brief.test.js
